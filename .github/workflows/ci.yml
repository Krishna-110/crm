name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything lives in crm/, an npm workspace holding client/ and server/.
defaults:
  run:
    working-directory: crm

env:
  # Nearly every user-visible date figure in this app is an IST calendar date. A UTC runner
  # silently changes what "today" means, so a suite that passes locally would fail here — or
  # worse, pass for the wrong reason.
  TZ: Asia/Kolkata
  # Prisma reads this at import time, so it must be set. vitest and playwright each rewrite
  # the database name to crm_test; the suites additionally refuse to run unless the server
  # confirms it connected to a *_test database.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm?schema=public
  TEST_PGDATABASE: crm_test

jobs:
  test:
    name: typecheck · build · 120 tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches development. The schema is plain Prisma-generated DDL, but pinning the
        # major keeps behaviour identical rather than merely compatible.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crm/package-lock.json

      - name: Environment
        run: node --version && npm --version

      # One lockfile for the whole workspace, so one install covers client and server.
      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm -w server exec -- prisma generate

      # Typecheck, build, then the suite. No separate database step: vitest's globalSetup
      # drops, recreates, migrates and seeds crm_test itself, so building it here would only
      # do the same work twice.
      #
      # That rebuild doubles as migration coverage — a migration that cannot apply to an
      # empty database fails the run — and it asserts the result contains zero plpgsql
      # functions. The schema is meant to hold no procedural code, and a suite whose premise
      # has quietly changed should say so rather than carry on.
      - name: Typecheck, build and test
        run: npm test

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    # Separate and gated: this costs a browser download and runs an order of magnitude
    # slower, so a logic regression is reported in about a minute rather than waiting on it.
    needs: test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crm/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm -w server exec -- prisma generate

      # Browsers are versioned with @playwright/test, so the lockfile is the right cache key.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('crm/package-lock.json') }}

      - name: Install Chromium
        # --with-deps pulls the system libraries headless Chromium needs on a bare runner.
        run: npx playwright install --with-deps chromium

      - name: Run browser suite
        # playwright.config.ts starts its own API (:3002 against crm_test) and Vite (:5174),
        # and its globalSetup rebuilds the database first.
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            crm/playwright-report/
            crm/test-results/
          retention-days: 7
